name: Deploy release to internal testing

on:
    pull_request:
        types: [ closed ]
        branches: [ develop ]

permissions:
    contents: write

concurrency:
    group: google-play-release
    cancel-in-progress: false

jobs:
    deploy:
        name: Build and upload internal release
        if: >-
            github.event.pull_request.merged == true &&
            startsWith(github.event.pull_request.head.ref, 'release/')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: google-play-internal

        steps:
            - name: Checkout released commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
                  fetch-depth: 0

            - name: Verify release state
              id: release
              env:
                  RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
                  RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail
                  git fetch origin "+refs/heads/main:refs/remotes/origin/main"

                  if ! git merge-base --is-ancestor origin/main "$RELEASE_SHA"; then
                    echo "::error::main must be an ancestor of the release commit."
                    exit 1
                  fi

                  VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
                  VERSION_CODE=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)

                  if [ "$RELEASE_BRANCH" != "release/$VERSION_NAME" ]; then
                    echo "::error::Release branch ($RELEASE_BRANCH) does not match VERSION_NAME ($VERSION_NAME)."
                    exit 1
                  fi

                  if ! printf '%s' "$VERSION_CODE" | grep -qE '^[1-9][0-9]*$'; then
                    echo "::error::Invalid VERSION_CODE: $VERSION_CODE"
                    exit 1
                  fi

                  RELEASE_NOTES_FILE="fastlane/metadata/android/ko-KR/changelogs/$VERSION_CODE.txt"
                  if [ ! -s "$RELEASE_NOTES_FILE" ]; then
                    echo "::error::Missing Korean Google Play release notes: $RELEASE_NOTES_FILE"
                    exit 1
                  fi

                  RELEASE_NOTES=$(cat "$RELEASE_NOTES_FILE")
                  if [ "${#RELEASE_NOTES}" -gt 500 ]; then
                    echo "::error::Release notes must be 500 characters or fewer."
                    exit 1
                  fi

                  if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION_NAME" >/dev/null 2>&1; then
                    echo "::error::v$VERSION_NAME has already been released."
                    exit 1
                  fi

                  {
                    echo "name=$VERSION_NAME"
                    echo "code=$VERSION_CODE"
                    echo "sha=$RELEASE_SHA"
                    echo "candidate_tag=internal-v$VERSION_NAME"
                  } >> "$GITHUB_OUTPUT"

            - name: Create internal release tag
              env:
                  RELEASE_SHA: ${{ steps.release.outputs.sha }}
                  CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  if git ls-remote --exit-code --tags origin "refs/tags/$CANDIDATE_TAG" >/dev/null 2>&1; then
                    git fetch origin "refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG"
                    TAG_SHA=$(git rev-list -n 1 "$CANDIDATE_TAG")
                    if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
                      echo "::error::$CANDIDATE_TAG points to a different commit."
                      exit 1
                    fi
                  else
                    git tag -a "$CANDIDATE_TAG" "$RELEASE_SHA" -m "Internal release $CANDIDATE_TAG"
                    git push origin "$CANDIDATE_TAG"
                  fi

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Grant permission to gradlew
              run: chmod +x ./gradlew

            - name: Create local.properties
              env:
                  LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
              run: |
                  if [ -z "$LOCAL_PROPERTIES" ]; then
                    echo "::error::LOCAL_PROPERTIES secret is not set."
                    exit 1
                  fi
                  printf '%s' "$LOCAL_PROPERTIES" > local.properties

            - name: Create google-services.json
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  if [ -z "$GOOGLE_SERVICES_JSON" ]; then
                    echo "::error::GOOGLE_SERVICES_JSON secret is not set."
                    exit 1
                  fi
                  printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

            - name: Restore upload keystore
              env:
                  UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
              run: |
                  if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
                    echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not set."
                    exit 1
                  fi
                  printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/poti-upload-key.jks"

            - name: Check Kotlin style
              run: ./gradlew ktlintCheck

            - name: Run Prod Release unit tests
              run: ./gradlew :app:testProdReleaseUnitTest

            - name: Build signed AAB
              env:
                  UPLOAD_STORE_FILE: ${{ runner.temp }}/poti-upload-key.jks
                  UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
                  UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
                  UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
              run: ./gradlew :app:bundleProdRelease

            - name: Upload AAB artifact
              uses: actions/upload-artifact@v4
              with:
                  name: poti-${{ steps.release.outputs.name }}-${{ steps.release.outputs.code }}
                  path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
                  retention-days: 30

            - name: Prepare Google Play release notes
              env:
                  VERSION_CODE: ${{ steps.release.outputs.code }}
              run: |
                  set -euo pipefail
                  mkdir -p "${{ runner.temp }}/whats-new"
                  cp \
                    "fastlane/metadata/android/ko-KR/changelogs/$VERSION_CODE.txt" \
                    "${{ runner.temp }}/whats-new/whatsnew-ko-KR"

            - name: Upload to Google Play internal testing
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
                  packageName: com.poti.android
                  releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
                  tracks: internal
                  status: completed
                  releaseName: v${{ steps.release.outputs.name }}
                  whatsNewDirectory: ${{ runner.temp }}/whats-new
