name: Deploy to Google Play

on:
    push:
        branches: [ main ]

permissions:
    contents: read

concurrency:
    group: google-play-internal
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to internal testing
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: google-play-internal

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Grant permission to gradlew
              run: chmod +x ./gradlew

            - name: Create local.properties
              env:
                  LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
              run: |
                  if [ -z "$LOCAL_PROPERTIES" ]; then
                    echo "::error::LOCAL_PROPERTIES secret is not set."
                    exit 1
                  fi
                  printf '%s' "$LOCAL_PROPERTIES" > local.properties

            - name: Create google-services.json
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  if [ -z "$GOOGLE_SERVICES_JSON" ]; then
                    echo "::error::GOOGLE_SERVICES_JSON secret is not set."
                    exit 1
                  fi
                  printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

            - name: Restore upload keystore
              env:
                  UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
              run: |
                  if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
                    echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not set."
                    exit 1
                  fi
                  printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/poti-upload-key.jks"

            - name: Set app version code
              run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

            - name: Verify and build signed AAB
              env:
                  UPLOAD_STORE_FILE: ${{ runner.temp }}/poti-upload-key.jks
                  UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
                  UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
                  UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
              run: |
                  ./gradlew \
                    ktlintCheck \
                    :app:testProdReleaseUnitTest \
                    :app:bundleProdRelease

            - name: Upload AAB artifact
              uses: actions/upload-artifact@v4
              with:
                  name: poti-prod-${{ github.run_number }}
                  path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
                  retention-days: 14

            - name: Upload to Google Play internal testing
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
                  packageName: com.poti.android
                  releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
                  tracks: internal
                  status: completed
