name: Release PR Check

on:
    pull_request:
        branches: [ develop ]
        types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
    contents: read

concurrency:
    group: release-pr-check-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate:
        name: Release PR Check
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        runs-on: ubuntu-latest

        steps:
            - name: Checkout release candidate
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fetch develop
              run: git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"

            - name: Validate changed files
              run: |
                  set -euo pipefail

                  VERSION_CODE=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
                  RELEASE_NOTES_FILE="fastlane/metadata/android/ko-KR/changelogs/$VERSION_CODE.txt"
                  mapfile -t CHANGED_FILES < <(git diff --name-only origin/develop...HEAD)

                  if [ "${#CHANGED_FILES[@]}" -ne 2 ]; then
                    echo "::error::A release PR must change exactly gradle.properties and $RELEASE_NOTES_FILE."
                    printf 'Changed file: %s\n' "${CHANGED_FILES[@]}"
                    exit 1
                  fi

                  for REQUIRED_FILE in gradle.properties "$RELEASE_NOTES_FILE"; do
                    if ! printf '%s\n' "${CHANGED_FILES[@]}" | grep -Fxq "$REQUIRED_FILE"; then
                      echo "::error::Release PR is missing required file: $REQUIRED_FILE"
                      exit 1
                    fi
                  done

                  git show origin/develop:gradle.properties |
                    grep -vE '^VERSION_(NAME|CODE)=' > "${RUNNER_TEMP}/base-gradle.properties"
                  grep -vE '^VERSION_(NAME|CODE)=' gradle.properties > "${RUNNER_TEMP}/release-gradle.properties"

                  if ! cmp -s "${RUNNER_TEMP}/base-gradle.properties" "${RUNNER_TEMP}/release-gradle.properties"; then
                    echo "::error::Only VERSION_NAME and VERSION_CODE may change in gradle.properties."
                    exit 1
                  fi

            - name: Validate version, branch, and release notes
              env:
                  RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail

                  VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
                  VERSION_CODE=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
                  BASE_VERSION_CODE=$(git show origin/develop:gradle.properties | sed -n 's/^VERSION_CODE=//p')

                  if ! printf '%s' "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "::error::VERSION_NAME must use x.y.z format: $VERSION_NAME"
                    exit 1
                  fi

                  if ! printf '%s' "$VERSION_CODE" | grep -qE '^[1-9][0-9]*$'; then
                    echo "::error::VERSION_CODE must be a positive integer: $VERSION_CODE"
                    exit 1
                  fi

                  if ! printf '%s' "$BASE_VERSION_CODE" | grep -qE '^[1-9][0-9]*$'; then
                    echo "::error::Invalid VERSION_CODE on develop: $BASE_VERSION_CODE"
                    exit 1
                  fi

                  EXPECTED_VERSION_CODE=$((BASE_VERSION_CODE + 1))
                  if [ "$VERSION_CODE" -ne "$EXPECTED_VERSION_CODE" ]; then
                    echo "::error::VERSION_CODE must be $EXPECTED_VERSION_CODE: $VERSION_CODE"
                    exit 1
                  fi

                  EXPECTED_BRANCH="release/$VERSION_NAME-code$VERSION_CODE"
                  if [ "$RELEASE_BRANCH" != "$EXPECTED_BRANCH" ]; then
                    echo "::error::Release branch must be $EXPECTED_BRANCH: $RELEASE_BRANCH"
                    exit 1
                  fi

                  RELEASE_NOTES_FILE="fastlane/metadata/android/ko-KR/changelogs/$VERSION_CODE.txt"
                  if [ ! -s "$RELEASE_NOTES_FILE" ]; then
                    echo "::error::Release notes are missing or empty: $RELEASE_NOTES_FILE"
                    exit 1
                  fi

                  RELEASE_NOTES=$(cat "$RELEASE_NOTES_FILE")
                  if [ "${#RELEASE_NOTES}" -gt 500 ]; then
                    echo "::error::Release notes must be 500 characters or fewer."
                    exit 1
                  fi

                  REMOTE_RELEASED_NAMES=$(
                    git ls-remote --tags --refs origin 'refs/tags/v*' |
                      awk '{print $2}' |
                      sed -nE 's#^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p'
                  )

                  if printf '%s\n' "$REMOTE_RELEASED_NAMES" | grep -Fxq "$VERSION_NAME"; then
                    echo "::error::v$VERSION_NAME has already been released."
                    exit 1
                  fi

                  LATEST_RELEASED_NAME=$(
                    printf '%s\n' "$REMOTE_RELEASED_NAMES" |
                      sed '/^$/d' |
                      sort -V |
                      tail -n 1
                  )

                  if [ -n "$LATEST_RELEASED_NAME" ]; then
                    HIGHEST_VERSION=$(printf '%s\n%s\n' "$LATEST_RELEASED_NAME" "$VERSION_NAME" | sort -V | tail -n 1)
                    if [ "$HIGHEST_VERSION" != "$VERSION_NAME" ]; then
                      echo "::error::VERSION_NAME ($VERSION_NAME) must be greater than the latest production version ($LATEST_RELEASED_NAME)."
                      exit 1
                    fi
                  fi
